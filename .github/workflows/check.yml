name: MoonBit Check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install MoonBit
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Version
        run: moon version --all
      - name: Verify toolchain floor
        run: |
          version=$(moonc -v | sed -n 's/^v\([0-9.]*\).*/\1/p')
          if [ -z "$version" ]; then
            echo "Unable to determine moonc version"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          if [ "$major" -eq 0 ] && { [ "$minor" -lt 10 ] || { [ "$minor" -eq 10 ] && [ "$patch" -lt 9 ]; }; }; then
            echo "MoonBit toolchain $version is older than the supported floor 0.10.9"
            exit 1
          fi
          echo "Using moonc $version (minimum 0.10.9)"
      - name: Update dependencies
        run: moon update
      - name: Format and check
        run: |
          moon fmt --check
          moon build --target wasm-gc
          moon check --deny-warn --target all
          moon info
          git diff --exit-code
      - name: Test
        run: |
          moon test --deny-warn --target all
      - name: Native coverage summary
        if: runner.os == 'Linux'
        run: |
          moon coverage analyze
          moon coverage report -f summary
